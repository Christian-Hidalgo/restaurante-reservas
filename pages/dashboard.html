<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis reservas · Casa Hidalgo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script type="module" src="../js/dashboard.js"></script>
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-logo">Casa Hidalgo</a>
    <div class="nav-derecha">
      <span class="nav-saludo">Hola, <span id="nombre-usuario">...</span></span>
      <div class="nav-links">
        <a href="nueva-reserva.html" class="btn-nav primario">Nueva reserva</a>
        <a href="perfil.html" class="btn-nav">Mi perfil</a>
        <button class="btn-nav peligro" id="btn-logout">Salir</button>
      </div>
    </div>
  </nav>

  <div class="contenido">
    <div class="cabecera">
      <div>
        <h1>Mis reservas</h1>
        <p>Consulta y gestiona todas tus reservas en Casa Hidalgo</p>
      </div>
    </div>

    <div class="filtros">
      <button class="filtro-btn activo" data-filtro="todas">Todas</button>
      <button class="filtro-btn" data-filtro="pendiente">Pendientes</button>
      <button class="filtro-btn" data-filtro="confirmada">Confirmadas</button>
      <button class="filtro-btn" data-filtro="cancelada">Canceladas</button>
    </div>

    <div class="lista-reservas" id="lista-reservas">
      <div class="cargando">Cargando reservas...</div>
    </div>
  </div>

  <!-- Modal confirmación cancelar -->
  <div class="modal-overlay" id="modal-cancelar">
    <div class="modal">
      <h3>Cancelar reserva</h3>
      <p>¿Estás seguro de que quieres cancelar esta reserva? Esta acción no se puede deshacer.</p>
      <div class="modal-botones">
        <button class="btn-nav" id="modal-no">Volver</button>
        <button class="btn-nav peligro" id="modal-si" style="border-color:#c0392b;color:#c0392b;">Sí, cancelar</button>
      </div>
    </div>
  </div>
</body>
</html>
